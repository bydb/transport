<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Einstellungen - Transport</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      padding: 24px;
      padding-top: 48px; /* Platz für macOS Traffic Lights */
      overflow-y: auto;
      height: auto;
    }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      -webkit-app-region: drag;
    }

    .settings-header h1,
    .settings-header button {
      -webkit-app-region: no-drag;
    }

    .settings-header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .close-btn {
      padding: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--secondary-color);
      border-radius: 6px;
    }

    .close-btn:hover {
      background: var(--tag-bg);
    }

    .section {
      margin-bottom: 32px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .add-btn {
      padding: 6px 12px;
      font-size: 13px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--primary-hover);
    }

    .list {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-info {
      flex: 1;
      min-width: 0;
    }

    .list-item-name {
      font-weight: 500;
    }

    .list-item-path {
      font-size: 12px;
      color: var(--secondary-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-item-actions {
      display: flex;
      gap: 8px;
      margin-left: 12px;
    }

    .edit-btn {
      padding: 6px 10px;
      font-size: 12px;
      background: transparent;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      cursor: pointer;
    }

    .edit-btn:hover {
      background: var(--primary-color);
      color: white;
    }

    .delete-btn {
      padding: 6px 10px;
      font-size: 12px;
      background: transparent;
      color: var(--error-color);
      border: 1px solid var(--error-color);
      border-radius: 4px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: var(--error-color);
      color: white;
    }

    .empty-message {
      padding: 20px;
      text-align: center;
      color: var(--secondary-color);
    }

    /* Add Form */
    .add-form {
      display: none;
      padding: 16px;
      background: var(--tag-bg);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .add-form.visible {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .form-row input {
      flex: 1;
    }

    .browse-btn {
      padding: 10px 16px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
    }

    .browse-btn:hover {
      background: var(--border-color);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* Tags as chips */
    .tags-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      min-height: 60px;
    }

    .tag-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--tag-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      font-size: 13px;
    }

    .tag-item .remove {
      cursor: pointer;
      color: var(--secondary-color);
      font-size: 16px;
      line-height: 1;
    }

    .tag-item .remove:hover {
      color: var(--error-color);
    }

    /* LanguageTool Section */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .toggle-label {
      font-weight: 500;
    }

    .toggle-desc {
      font-size: 12px;
      color: var(--secondary-color);
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--border-color);
      border-radius: 24px;
      transition: background 0.2s;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: var(--primary-color);
    }

    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }

    /* Filename Format */
    .format-help {
      margin-top: 8px;
      font-size: 12px;
      color: var(--secondary-color);
      line-height: 1.6;
    }

    .format-help code {
      background: var(--tag-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .format-preview {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--tag-bg);
      border-radius: 6px;
      font-size: 13px;
      color: var(--secondary-color);
    }

    .format-preview span {
      font-family: monospace;
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <div class="settings-header">
    <h1>Einstellungen</h1>
    <button class="close-btn" id="close-btn" title="Schließen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Destinations Section -->
  <div class="section">
    <div class="section-header">
      <h2>Zielorte</h2>
      <button class="add-btn" id="add-destination-btn">+ Hinzufügen</button>
    </div>

    <div class="add-form" id="add-destination-form">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="dest-name" placeholder="z.B. Inbox">
      </div>
      <div class="form-group">
        <label>Ordner</label>
        <div class="form-row">
          <input type="text" id="dest-path" placeholder="/Users/...">
          <button class="browse-btn" id="browse-btn">Auswählen</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" id="cancel-dest-btn">Abbrechen</button>
        <button class="btn-primary" id="save-dest-btn">Speichern</button>
      </div>
    </div>

    <div class="list" id="destinations-list">
      <!-- Wird dynamisch gefüllt -->
    </div>
  </div>

  <!-- Tags Section -->
  <div class="section">
    <div class="section-header">
      <h2>Tags</h2>
      <button class="add-btn" id="add-tag-btn">+ Hinzufügen</button>
    </div>

    <div class="add-form" id="add-tag-form">
      <div class="form-group">
        <label>Tag Name</label>
        <input type="text" id="tag-name" placeholder="z.B. projekt">
      </div>
      <div class="form-actions">
        <button class="btn-secondary" id="cancel-tag-btn">Abbrechen</button>
        <button class="btn-primary" id="save-tag-btn">Hinzufügen</button>
      </div>
    </div>

    <div class="tags-list" id="tags-list">
      <!-- Wird dynamisch gefüllt -->
    </div>
  </div>

  <!-- Filename Format Section -->
  <div class="section">
    <h2 style="margin-bottom: 12px;">Dateiname</h2>
    <div class="form-group">
      <label>Format</label>
      <input type="text" id="filename-format" placeholder="{timestamp} - {title}">
      <div class="format-help">
        <code>{timestamp}</code> = YYYYMMDDHHMM (z.B. 202601270901)<br>
        <code>{title}</code> = Erste Zeile des Textes
      </div>
    </div>
    <div class="format-preview">
      Vorschau: <span id="filename-preview">202601270901 - Meine Notiz.md</span>
    </div>
  </div>

  <!-- LanguageTool Section -->
  <div class="section">
    <h2 style="margin-bottom: 12px;">Grammatikkorrektur</h2>
    <div class="toggle-row">
      <div>
        <div class="toggle-label">LanguageTool aktivieren</div>
        <div class="toggle-desc">Automatische Rechtschreib- und Grammatikprüfung beim Transport</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="languagetool-enabled">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
