<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Transport</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Toolbar -->
    <div class="toolbar">
      <button id="transport-btn" class="btn-transport" disabled>
        Transport
      </button>
      <button id="settings-btn" class="btn-settings" title="Einstellungen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <!-- Editor -->
    <textarea id="editor" placeholder="Hier einfach lostippen..." autofocus></textarea>

    <!-- Transport Modal -->
    <div id="transport-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Transport nach</h2>

        <div class="destinations" id="destinations">
          <!-- Wird dynamisch gefüllt -->
        </div>

        <div class="tags-section">
          <label>Tags:</label>
          <div class="tags-container" id="tags-container">
            <!-- Wird dynamisch gefüllt -->
          </div>
        </div>

        <div class="timestamp-section">
          <label>
            <input type="checkbox" id="add-timestamp" checked>
            Zeitstempel hinzufügen
          </label>
        </div>

        <div class="modal-actions">
          <button id="cancel-btn" class="btn-secondary">Abbrechen</button>
          <button id="confirm-transport-btn" class="btn-primary" disabled>Transportieren</button>
        </div>
      </div>
    </div>

    <!-- Status Message -->
    <div id="status" class="status hidden"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
